name: Design change
description: An idea or improvement for the next version
labels: ["design"]
body:
  - type: input
    id: area
    attributes:
      label: Part(s) or area
      placeholder: e.g. 216 pan-tilt base, battery pod, firmware
  - type: textarea
    id: idea
    attributes:
      label: The change and why
    validations:
      required: true
  - type: dropdown
    id: tested
    attributes:
      label: Tested?
      options:
        - Idea only
        - Modelled
        - Printed / built
        - Tested in water
